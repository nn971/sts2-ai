[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sts2-ai"
version = "0.0.1"
description = "Research infrastructure for whole-run strategic AI in Slay the Spire 2"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "sts2-ai contributors" }
]
dependencies = []

[project.scripts]
sts2-ai = "sts2_ai.cli:main"

[project.optional-dependencies]
neural = [
  "torch>=2.4",
]
dev = [
  "pytest>=8",
  "ruff>=0.11",
  "mypy>=1.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sts2_ai"]
