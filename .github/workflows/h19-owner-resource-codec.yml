name: h19-owner-resource-codec

on:
  pull_request:
    paths:
      - 'src/sts2_ai/models/shared_game_objects.py'
      - 'src/sts2_ai/models/shared_transformer.py'
      - 'src/sts2_ai/models/shared_owner_transformer_v2.py'
      - 'src/sts2_ai/training/h16_public_codec.py'
      - 'src/sts2_ai/training/h19_resource_codec.py'
      - 'tests/test_h19_owner_resources.py'
      - 'tests/test_h19_owner_model.py'
      - '.github/workflows/h19-owner-resource-codec.yml'
  workflow_dispatch:

jobs:
  h19-owner-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU Torch and research tests
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Lint versioned codec and owner model
        run: |
          python -m ruff check src/sts2_ai/models/shared_game_objects.py src/sts2_ai/models/shared_transformer.py src/sts2_ai/models/shared_owner_transformer_v2.py src/sts2_ai/training/h16_public_codec.py src/sts2_ai/training/h19_resource_codec.py tests/test_h19_owner_resources.py tests/test_h19_owner_model.py
      - name: Focused schema, owner, checkpoint and backward compatibility tests
        run: |
          python -m pytest -q tests/test_h19_owner_resources.py tests/test_h19_owner_model.py tests/test_h16_deck_multiplicity.py tests/test_shared_transformer_h7.py
