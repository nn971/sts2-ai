name: act1-checkpoint-selection

on:
  push:
    paths:
      - "src/sts2_ai/evaluation/checkpoint_selection.py"
      - "tools/evaluate_act1_checkpoints.py"
      - "tools/evaluate_phase_split.py"
      - "tools/validate_v8_checkpoints.fish"
      - "tests/test_act1_checkpoint_selection.py"
      - ".github/workflows/act1-selection-ci.yml"
  pull_request:
    paths:
      - "src/sts2_ai/evaluation/checkpoint_selection.py"
      - "tools/evaluate_act1_checkpoints.py"
      - "tools/evaluate_phase_split.py"
      - "tests/test_act1_checkpoint_selection.py"
  workflow_dispatch:

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Exact paired inference and resume-isolation tests
        run: python -m pytest -q tests/test_act1_checkpoint_selection.py tests/test_evaluation_progress.py
      - name: Lint new selection tools
        run: |
          python -m ruff check \
            src/sts2_ai/evaluation/checkpoint_selection.py \
            tools/evaluate_act1_checkpoints.py \
            tests/test_act1_checkpoint_selection.py
