name: h26-searchfree-pilot

on:
  pull_request:
    paths:
      - 'src/sts2_ai/training/h26_*.py'
      - 'src/sts2_ai/training/h24_joint_act_model.py'
      - 'src/sts2_ai/training/h25_alternating.py'
      - 'src/sts2_ai/training/h16_joint_act_pilot.py'
      - 'tools/train_h16_joint_act_pilot.py'
      - 'tools/train_h26_*.py'
      - 'tests/test_h26_*.py'
      - '.github/workflows/h26-searchfree.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  h26-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Lint, compile, and CLI introspection
        run: |
          python -m ruff check src/sts2_ai/training/h26_tactical.py src/sts2_ai/training/h26_combat_rl.py src/sts2_ai/training/h26_public_intent_law.py tools/train_h26_searchfree_a0.py tests/test_h26_*.py
          python -m compileall -q src/sts2_ai/training/h26_tactical.py src/sts2_ai/training/h26_combat_rl.py tools/train_h26_searchfree_a0.py
          python tools/train_h26_searchfree_a0.py --help > /dev/null
      - name: Public feature, on-policy loss, and checkpoint tests
        run: |
          python -m pytest -q tests/test_h26_*.py tests/test_h24_joint_act_model.py tests/test_h25_alternating.py
