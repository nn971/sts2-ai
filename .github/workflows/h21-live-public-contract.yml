name: h21-live-public-contract

on:
  pull_request:
    paths:
      - 'src/sts2_ai/models/shared_game_objects.py'
      - 'src/sts2_ai/training/h19_resource_codec.py'
      - 'src/sts2_ai/training/h20_map_graph_codec.py'
      - 'src/sts2_ai/training/h21_macro_offer_codec.py'
      - 'src/sts2_ai/training/h21_stable_identity.py'
      - 'src/sts2_ai/models/shared_macro_transformer_v2.py'
      - 'src/sts2_ai/training/h21_field_coverage.py'
      - 'tools/probe_h21_live_public.py'
      - 'tools/check_h21_public_source_schema.py'
      - '.github/workflows/h21-live-public-contract.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  h21-live-public-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nn971/sts2-emulator
          ref: fix/h18-public-observation-v1-20261104
          path: emulator-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install public codec
        run: python -m pip install -e .
      - name: Verify every public C# DTO member is classified
        run: |
          python tools/check_h21_public_source_schema.py --emulator-root emulator-v1
      - name: Build actual public v1 emulator
        run: |
          dotnet build emulator-v1/src/Sts2Emulator.Cli/Sts2Emulator.Cli.csproj -c Release
      - name: Verify actual v1 public observations and exact legal actions
        run: |
          python tools/probe_h21_live_public.py \
            --emulator-dll emulator-v1/src/Sts2Emulator.Cli/bin/Release/net9.0/Sts2Emulator.Cli.dll \
            --max-decisions 55 --strict > h21-live-public-contract.json
          cat h21-live-public-contract.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h21-live-public-contract
          path: h21-live-public-contract.json
          if-no-files-found: warn
