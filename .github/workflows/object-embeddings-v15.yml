name: object-embeddings-v15
on:
  push:
    paths:
      - 'src/sts2_ai/models/object_instances.py'
      - 'src/sts2_ai/models/object_embeddings.py'
      - 'src/sts2_ai/models/pooled_objects.py'
      - 'src/sts2_ai/models/relational_objects.py'
      - 'src/sts2_ai/models/phase_split.py'
      - 'tests/test_object_instances_v15.py'
      - 'tests/test_pooled_objects_v15.py'
      - 'tests/test_relational_objects_v15.py'
      - 'tests/test_relational_ppo_v15.py'
      - 'tests/test_vectorized_objects_v15.py'
      - 'tests/test_batched_relational_v15.py'
      - 'tests/test_cached_relational_topology_v15.py'
      - 'tests/test_cached_object_features_v15.py'
      - 'tests/test_vectorized_ppo_loss_v15.py'
      - 'tests/test_real_minibatch_profile_v15.py'
      - 'tests/test_choice_pool_visibility_v15.py'
      - 'tools/profile_v15_real_minibatches.py'
      - 'tools/benchmark_v15_attention.py'
      - 'tests/test_representation_audit_v15.py'
      - 'tools/audit_v15_representation.py'
      - 'tests/test_pooled_ppo_v15.py'
      - 'src/sts2_ai/training/pooled_ppo_v15.py'
      - 'tools/train_pooled_objects_v15.py'
      - '.github/workflows/object-embeddings-v15.yml'
  pull_request:
    paths:
      - 'src/sts2_ai/models/object_instances.py'
      - 'src/sts2_ai/models/object_embeddings.py'
      - 'src/sts2_ai/models/pooled_objects.py'
      - 'src/sts2_ai/models/relational_objects.py'
      - 'src/sts2_ai/models/phase_split.py'
      - 'tests/test_object_instances_v15.py'
      - 'tests/test_pooled_objects_v15.py'
      - 'tests/test_relational_objects_v15.py'
      - 'tests/test_relational_ppo_v15.py'
      - 'tests/test_vectorized_objects_v15.py'
      - 'tests/test_batched_relational_v15.py'
      - 'tests/test_cached_relational_topology_v15.py'
      - 'tests/test_cached_object_features_v15.py'
      - 'tests/test_vectorized_ppo_loss_v15.py'
      - 'tests/test_real_minibatch_profile_v15.py'
      - 'tests/test_choice_pool_visibility_v15.py'
      - 'tools/profile_v15_real_minibatches.py'
      - 'tools/benchmark_v15_attention.py'
      - 'tests/test_representation_audit_v15.py'
      - 'tools/audit_v15_representation.py'
      - 'tests/test_pooled_ppo_v15.py'
      - 'src/sts2_ai/training/pooled_ppo_v15.py'
      - 'tools/train_pooled_objects_v15.py'
      - '.github/workflows/object-embeddings-v15.yml'
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and tests
        run: python -m pip install -e '.[dev]'
      - name: Test v15 object extraction and embeddings
        run: python -m pytest -q tests/test_object_instances_v15.py tests/test_pooled_objects_v15.py tests/test_pooled_ppo_v15.py tests/test_relational_objects_v15.py tests/test_relational_ppo_v15.py tests/test_vectorized_objects_v15.py tests/test_batched_relational_v15.py tests/test_cached_relational_topology_v15.py tests/test_cached_object_features_v15.py tests/test_vectorized_ppo_loss_v15.py tests/test_real_minibatch_profile_v15.py tests/test_choice_pool_visibility_v15.py tests/test_representation_audit_v15.py
      - name: Syntax-check native audit and benchmarking commands
        run: python -m compileall -q tools/audit_v15_representation.py tools/benchmark_v15_attention.py tools/profile_v15_real_minibatches.py
      - name: CPU batched-attention throughput smoke
        run: python -u tools/benchmark_v15_attention.py --batch-sizes 1 4 --devices cpu --width 16 --warmups 0 --trials 1 --report /tmp/v15f-ci-benchmark.json
