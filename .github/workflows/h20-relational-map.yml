name: h20-relational-map

on:
  pull_request:
    paths:
      - 'src/sts2_ai/models/shared_game_objects.py'
      - 'src/sts2_ai/models/shared_transformer.py'
      - 'src/sts2_ai/models/shared_map_transformer_v2.py'
      - 'src/sts2_ai/training/h20_map_graph_codec.py'
      - 'tests/test_h20_map_graph.py'
      - '.github/workflows/h20-relational-map.yml'
  workflow_dispatch:

jobs:
  h20-map-graph-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU Torch and research tests
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Isolated H20 and inherited H19 lint
        run: |
          python -m ruff check src/sts2_ai/models/shared_game_objects.py src/sts2_ai/models/shared_transformer.py src/sts2_ai/models/shared_map_transformer_v2.py src/sts2_ai/training/h20_map_graph_codec.py tests/test_h20_map_graph.py
      - name: Graph mapping, equivariance and owner codec regressions
        run: |
          python -m pytest -q tests/test_h20_map_graph.py tests/test_h19_owner_resources.py tests/test_h19_owner_model.py tests/test_h16_deck_multiplicity.py tests/test_shared_transformer_h7.py
