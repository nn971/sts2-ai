name: h7-reference-combat-smoke

on:
  pull_request:
    paths:
      - 'src/sts2_ai/models/h7_public_policy.py'
      - 'src/sts2_ai/training/h7_combat_ppo.py'
      - 'tools/train_h7_reference_combat.py'
      - 'tests/test_h7_combat_ppo.py'
      - '.github/workflows/h7-reference-combat-smoke.yml'
  workflow_dispatch:

jobs:
  source-fair-h7-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: nn971/sts2-emulator
          ref: e56779ccd86725582af580925ca8242826ba2229
          path: emulator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install CPU Torch
        working-directory: ai
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_h7_combat_ppo.py
      - name: Build H5-compatible real semantic emulator
        working-directory: emulator
        run: |
          dotnet restore Sts2Emulator.sln
          dotnet build Sts2Emulator.sln -c Release --no-restore
      - name: Run small random-start H7 reference-law PPO integration
        working-directory: ai
        run: |
          python -u tools/train_h7_reference_combat.py \
            --emulator-dll ../emulator/src/Sts2Emulator.Cli/bin/Release/net9.0/Sts2Emulator.Cli.dll \
            --emulator-bindings ../emulator/bindings/python \
            --emulator-revision e56779ccd86725582af580925ca8242826ba2229 \
            --output-root ci-h7-reference --device cpu \
            --width 32 --layers 1 --heads 4 --feedforward 64 \
            --rounds 1 --episodes-per-round 16 --workers 2 \
            --eval-every 1 --eval-episodes 16 \
            --ppo-epochs 1 --ppo-minibatch 16 --ppo-sample-limit 64 \
            --max-boundaries 1200 --execute
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("ci-h7-reference/progress.json").read_text())
          assert len(report["history"]) == 1
          row=report["history"][0]
          assert row["train"]["combats"] == 16
          assert len(row["train"]["by_cell"]) == 16
          assert row["selection"]["combats"] == 16
          assert row["updates"] > 0
          assert Path("ci-h7-reference/optimizer-checkpoint.pt").is_file()
          assert Path("ci-h7-reference/final-player.pt").is_file()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h7-reference-one-round-diagnostics
          path: ai/ci-h7-reference/progress.json
          if-no-files-found: ignore
