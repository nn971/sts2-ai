name: p2-throughput-profile-contract

on:
  push:
    branches: [main]
    paths:
      - 'src/sts2_ai/search/combat_puct.py'
      - 'src/sts2_ai/emulator/jsonl_backend.py'
      - 'src/sts2_ai/training/h16_joint_act_pilot.py'
      - 'tests/test_p2_throughput_profile.py'
      - 'tools/profile_p2_joint_throughput.py'
      - '.github/workflows/p2-throughput-profile.yml'
  pull_request:
    paths:
      - 'src/sts2_ai/search/combat_puct.py'
      - 'src/sts2_ai/emulator/jsonl_backend.py'
      - 'src/sts2_ai/training/h16_joint_act_pilot.py'
      - 'tests/test_p2_throughput_profile.py'
      - 'tools/profile_p2_joint_throughput.py'
      - '.github/workflows/p2-throughput-profile.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p2-profile-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lightweight profiler dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint and compile profiling paths
        run: |
          python -m ruff check src/sts2_ai/search/combat_puct.py src/sts2_ai/emulator/jsonl_backend.py tests/test_p2_throughput_profile.py
          python -m compileall -q src/sts2_ai/search/combat_puct.py src/sts2_ai/emulator/jsonl_backend.py src/sts2_ai/training/h16_joint_act_pilot.py tools/profile_p2_joint_throughput.py
      - name: Run opt-in teacher/bridge profiling contracts
        run: python -m pytest -q tests/test_p2_throughput_profile.py
