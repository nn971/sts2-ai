name: p2-throughput-profile-contract

on:
  push:
    branches: [main]
    paths:
      - 'src/sts2_ai/search/combat_puct.py'
      - 'src/sts2_ai/emulator/jsonl_backend.py'
      - 'src/sts2_ai/training/h16_joint_act_pilot.py'
      - 'tools/train_h16_joint_act_pilot.py'
      - 'tools/train_h18_generated_a0.py'
      - 'src/sts2_ai/models/h16_batch_actor.py'
      - 'src/sts2_ai/training/h16_public_codec.py'
      - 'tests/test_p2_throughput_profile.py'
      - 'tests/test_p2_cohort_comparison.py'
      - 'tests/test_p2_replay_diagnostics.py'
      - 'tools/p2_replay_diagnostics.py'
      - 'tools/report_p2_cohort_comparison.py'
      - 'tools/report_p2_actor_ab.py'
      - 'tools/report_p2_actor_abba.py'
      - 'tools/run_p2_actor_abba.py'
      - 'tests/test_p2_actor_abba.py'
      - 'tools/report_p2_profile_overhead.py'
      - 'tests/test_p2_measurement_reports.py'
      - 'tests/test_h16_subset_aliases.py'
      - 'tools/profile_p2_joint_throughput.py'
      - 'tools/profile_p2_parallel_cohort.py'
      - 'tools/probe_p2_exact_fork_prefix.py'
      - 'src/sts2_ai/search/p2_exact_prefix_cache.py'
      - 'tests/test_p2_exact_prefix_cache.py'
      - 'tests/test_h16_p2_exact_prefix_integration.py'
      - 'tests/test_h18_p2_training_stage.py'
      - 'tests/test_p2_exact_fork_prefix.py'
      - 'tools/probe_p2_native_jsonl.py'
      - '.github/workflows/p2-throughput-profile.yml'
  pull_request:
    paths:
      - 'src/sts2_ai/search/combat_puct.py'
      - 'src/sts2_ai/emulator/jsonl_backend.py'
      - 'src/sts2_ai/training/h16_joint_act_pilot.py'
      - 'tools/train_h16_joint_act_pilot.py'
      - 'tools/train_h18_generated_a0.py'
      - 'src/sts2_ai/models/h16_batch_actor.py'
      - 'src/sts2_ai/training/h16_public_codec.py'
      - 'tests/test_p2_throughput_profile.py'
      - 'tests/test_p2_cohort_comparison.py'
      - 'tests/test_p2_replay_diagnostics.py'
      - 'tools/p2_replay_diagnostics.py'
      - 'tools/report_p2_cohort_comparison.py'
      - 'tools/report_p2_actor_ab.py'
      - 'tools/report_p2_actor_abba.py'
      - 'tools/run_p2_actor_abba.py'
      - 'tests/test_p2_actor_abba.py'
      - 'tools/report_p2_profile_overhead.py'
      - 'tests/test_p2_measurement_reports.py'
      - 'tests/test_h16_subset_aliases.py'
      - 'tools/profile_p2_joint_throughput.py'
      - 'tools/profile_p2_parallel_cohort.py'
      - 'tools/probe_p2_exact_fork_prefix.py'
      - 'src/sts2_ai/search/p2_exact_prefix_cache.py'
      - 'tests/test_p2_exact_prefix_cache.py'
      - 'tests/test_h16_p2_exact_prefix_integration.py'
      - 'tests/test_h18_p2_training_stage.py'
      - 'tests/test_p2_exact_fork_prefix.py'
      - 'tools/probe_p2_native_jsonl.py'
      - '.github/workflows/p2-throughput-profile.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p2-profile-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lightweight profiler dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint and compile profiling paths
        run: |
          python -m ruff check src/sts2_ai/search/combat_puct.py src/sts2_ai/search/p2_exact_prefix_cache.py src/sts2_ai/models/h16_batch_actor.py src/sts2_ai/training/h16_public_codec.py src/sts2_ai/emulator/jsonl_backend.py tests/test_p2_throughput_profile.py tools/profile_p2_joint_throughput.py tools/profile_p2_parallel_cohort.py tools/probe_p2_native_jsonl.py tools/report_p2_cohort_comparison.py tools/report_p2_actor_ab.py tools/report_p2_actor_abba.py tools/run_p2_actor_abba.py tools/probe_p2_exact_fork_prefix.py tools/report_p2_profile_overhead.py tools/p2_replay_diagnostics.py tests/test_p2_cohort_comparison.py tests/test_p2_measurement_reports.py tests/test_p2_actor_abba.py tests/test_p2_exact_fork_prefix.py tests/test_p2_exact_prefix_cache.py tests/test_h16_p2_exact_prefix_integration.py tests/test_p2_replay_diagnostics.py tests/test_h16_subset_aliases.py tests/test_h18_p2_training_stage.py tools/train_h16_joint_act_pilot.py tools/train_h18_generated_a0.py
          python -m compileall -q src/sts2_ai/search/combat_puct.py src/sts2_ai/search/p2_exact_prefix_cache.py src/sts2_ai/models/h16_batch_actor.py src/sts2_ai/training/h16_public_codec.py src/sts2_ai/emulator/jsonl_backend.py src/sts2_ai/training/h16_joint_act_pilot.py tools/profile_p2_joint_throughput.py tools/profile_p2_parallel_cohort.py tools/probe_p2_native_jsonl.py tools/report_p2_cohort_comparison.py tools/report_p2_actor_ab.py tools/report_p2_actor_abba.py tools/run_p2_actor_abba.py tools/probe_p2_exact_fork_prefix.py tools/report_p2_profile_overhead.py tools/p2_replay_diagnostics.py tools/train_h16_joint_act_pilot.py tools/train_h18_generated_a0.py
          python tools/probe_p2_native_jsonl.py --help >/dev/null
          python tools/report_p2_actor_ab.py --help >/dev/null
          python tools/report_p2_actor_abba.py --help >/dev/null
          python tools/run_p2_actor_abba.py --help >/dev/null
          python tools/probe_p2_exact_fork_prefix.py --help >/dev/null
          python tools/report_p2_profile_overhead.py --help >/dev/null
      - name: Run opt-in teacher/bridge profiling contracts
        run: python -m pytest -q tests/test_p2_throughput_profile.py tests/test_p2_cohort_comparison.py tests/test_p2_measurement_reports.py tests/test_p2_actor_abba.py tests/test_p2_exact_fork_prefix.py tests/test_p2_exact_prefix_cache.py tests/test_h16_p2_exact_prefix_integration.py tests/test_p2_replay_diagnostics.py tests/test_h16_subset_aliases.py tests/test_h18_p2_training_stage.py
