name: enemy-attention-v13

on:
  push:
    paths:
      - "src/sts2_ai/models/neural.py"
      - "src/sts2_ai/models/enemy_attention.py"
      - "src/sts2_ai/models/phase_split.py"
      - "src/sts2_ai/training/enemy_attention.py"
      - "src/sts2_ai/training/instance_combat.py"
      - "src/sts2_ai/training/phase_split_ppo_batch.py"
      - "src/sts2_ai/training/phase_split_selfplay.py"
      - "tests/test_enemy_attention_v13.py"
      - "tests/test_enemy_attention_v13_summary.py"
      - "tools/summarize_enemy_attention_v13.py"
      - ".github/workflows/enemy-attention-v13.yml"
  pull_request:
    paths:
      - "src/sts2_ai/models/neural.py"
      - "src/sts2_ai/models/enemy_attention.py"
      - "src/sts2_ai/training/enemy_attention.py"
      - "src/sts2_ai/training/phase_split_ppo_batch.py"
      - "tests/test_enemy_attention_v13.py"
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,neural]'
      - name: v13 unit and v8 regression tests
        run: |
          python -m pytest -q \
            tests/test_enemy_attention_v13.py \
            tests/test_enemy_attention_v13_summary.py \
            tests/test_enemy_instances_v8.py \
            tests/test_phase_split_ppo_batch.py \
            tests/test_capacity_width_v12.py
      - name: Lint touched Python sources
        run: |
          python -m ruff check \
            src/sts2_ai/models/enemy_attention.py \
            src/sts2_ai/models/neural.py \
            src/sts2_ai/models/phase_split.py \
            src/sts2_ai/training/enemy_attention.py \
            src/sts2_ai/training/instance_combat.py \
            src/sts2_ai/training/phase_split_ppo_batch.py \
            src/sts2_ai/training/phase_split_selfplay.py \
            tests/test_enemy_attention_v13.py \
            tests/test_enemy_attention_v13_summary.py \
            tools/summarize_enemy_attention_v13.py
