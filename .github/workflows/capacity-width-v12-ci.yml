name: v8-capacity-width-parity

on:
  push:
    paths:
      - "src/sts2_ai/models/width_expansion.py"
      - "tools/widen_phase_split.py"
      - "tools/summarize_capacity_v12.py"
      - "tools/evaluate_act1_checkpoints.py"
      - "tests/test_capacity_width_v12.py"
      - ".github/workflows/capacity-width-v12-ci.yml"
  pull_request:
    paths:
      - "src/sts2_ai/models/width_expansion.py"
      - "tools/widen_phase_split.py"
      - "tools/summarize_capacity_v12.py"
      - "tools/evaluate_act1_checkpoints.py"
      - "tests/test_capacity_width_v12.py"
  workflow_dispatch:

jobs:
  width-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Validate width expansion and paired comparison
        run: |
          python -m pytest -q \
            tests/test_capacity_width_v12.py \
            tests/test_act1_checkpoint_selection.py \
            tests/test_longrun_review_tools.py
      - name: Lint capacity source and tests
        run: |
          python -m ruff check \
            src/sts2_ai/models/width_expansion.py \
            tools/widen_phase_split.py \
            tools/summarize_capacity_v12.py \
            tools/evaluate_act1_checkpoints.py \
            tests/test_capacity_width_v12.py
