name: handcrafted-cutoff-offline

on:
  push:
    branches:
      - benchmark/handcrafted-cutoff-offline

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: heldout-distillation-4seed
          run-id: 37731639664
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input-data
      - name: Evaluate hand-designed value on the exact grouped holdout
        run: |
          TARGETS="$(find input-data -name 'learning-pilot-targets.jsonl' -print -quit)"
          test -n "$TARGETS"
          python - "$TARGETS" <<'PY'
          import json
          import sys
          from pathlib import Path
          from dataclasses import asdict

          from sts2_ai.training import (
              evaluate_heldout_baselines,
              load_training_jsonl,
              split_training_examples,
          )

          examples = load_training_jsonl(Path(sys.argv[1]))
          train, validation = split_training_examples(examples, seed=7)
          result = evaluate_heldout_baselines(train, validation)
          print(json.dumps(asdict(result), sort_keys=True, indent=2))
          PY
