name: h25-alternating-pilot

on:
  pull_request:
    paths:
      - 'src/sts2_ai/training/h25_*.py'
      - 'tools/train_h25_*.py'
      - 'tools/train_h16_joint_act_pilot.py'
      - 'tests/test_h25_*.py'
      - '.github/workflows/h25-alternating-pilot.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  h25-pilot-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU Torch and H25 test environment
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Lint, compile and inspect pilot CLI
        run: |
          python -m ruff check src/sts2_ai/training/h25_alternating.py tests/test_h25_alternating.py tools/train_h25_alternating_a0.py
          python -m compileall -q src/sts2_ai/training/h25_alternating.py tools/train_h25_alternating_a0.py
          python tools/train_h25_alternating_a0.py --help > /dev/null
      - name: Split-model, replay, reward and distillation tests
        run: |
          python -m pytest -q tests/test_h25_alternating.py
