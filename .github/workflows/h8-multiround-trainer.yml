name: h8-multiround-trainer

on:
  push:
    branches:
      - research/h8-multiround-trainer-20261028
    paths:
      - 'tools/train_h7_reference_combat.py'
      - 'tools/benchmark_h8_h7_policy_pilot.py'
      - 'tools/benchmark_h8_training_iteration.py'
      - 'tests/test_h8_multiround_trainer.py'
      - 'src/sts2_ai/training/h7_combat_ppo.py'
      - '.github/workflows/h8-multiround-trainer.yml'
  pull_request:
    paths:
      - 'tools/train_h7_reference_combat.py'
      - 'tools/benchmark_h8_h7_policy_pilot.py'
      - 'tools/benchmark_h8_training_iteration.py'
      - 'tests/test_h8_multiround_trainer.py'
      - 'src/sts2_ai/training/h7_combat_ppo.py'
      - '.github/workflows/h8-multiround-trainer.yml'
  workflow_dispatch:

jobs:
  h8-native-resumable-trainer:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nn971/sts2-emulator
          ref: research/h8-h7-reference-law-benchmark-20261028
          path: external-h8-emulator
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model/test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[neural,dev]'
      - name: Validate H7 and H8 PPO unit tests
        run: |
          python -m pytest -q \
            tests/test_h8_multiround_trainer.py \
            tests/test_h8_training_iteration.py \
            tests/test_h8_h7_policy_pilot.py \
            tests/test_h7_terminal_replay_audit.py \
            tests/test_h7_combat_ppo.py
      - name: Build paired H8 emulator
        run: |
          dotnet restore external-h8-emulator/Sts2Emulator.sln
          dotnet build external-h8-emulator/Sts2Emulator.sln -c Release --no-restore -m:1
      - name: H8 2-round genuine PPO, checkpoint and greedy selection on CPU
        run: |
          python -u tools/train_h7_reference_combat.py \
            --emulator-dll external-h8-emulator/src/Sts2Emulator.Cli/bin/Release/net9.0/Sts2Emulator.Cli.dll \
            --emulator-bindings external-h8-emulator/bindings/python \
            --emulator-revision "$(git -C external-h8-emulator rev-parse HEAD)" \
            --output-root /tmp/h8-multiround-cpu \
            --rollout-backend h8-native --actor-backend shared \
            --actor-device cpu --device cpu --workers 2 \
            --rounds 2 --episodes-per-round 16 --max-boundaries 1200 \
            --train-terminal-replay-every 2 \
            --eval-every 2 --eval-episodes 16 \
            --ppo-epochs 1 --ppo-minibatch 16 --ppo-sample-limit 64 \
            --execute
      - name: Validate resume and persistent progress
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/h8-multiround-cpu')
          report = json.loads((root/'progress.json').read_text())
          assert len(report['history']) == 2
          assert all(row['train']['combats'] == 16 for row in report['history'])
          assert all(row['rollout_backend'] == 'h8-native' for row in report['history'])
          assert all(row['source_decisions'] >= 2 for row in report['history'])
          assert all(row['optimizer_seconds'] > 0 for row in report['history'])
          assert report['history'][-1]['selection']['combats'] == 16
          assert (root/'final-player.pt').exists()
          assert (root/'optimizer-checkpoint.pt').exists()
          print('H8 multi-round training, checkpoint and evaluation verified.')
          PY
          python -u tools/train_h7_reference_combat.py \
            --emulator-dll external-h8-emulator/src/Sts2Emulator.Cli/bin/Release/net9.0/Sts2Emulator.Cli.dll \
            --emulator-bindings external-h8-emulator/bindings/python \
            --emulator-revision "$(git -C external-h8-emulator rev-parse HEAD)" \
            --output-root /tmp/h8-multiround-cpu \
            --rollout-backend h8-native --actor-backend shared \
            --actor-device cpu --device cpu --workers 2 \
            --rounds 2 --episodes-per-round 16 --max-boundaries 1200 \
            --train-terminal-replay-every 2 \
            --eval-every 2 --eval-episodes 16 \
            --ppo-epochs 1 --ppo-minibatch 16 --ppo-sample-limit 64 \
            --resume --execute
      - name: Upload training progress and checkpoint metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h8-multiround-cpu-progress
          path: /tmp/h8-multiround-cpu/progress.json
          if-no-files-found: ignore
