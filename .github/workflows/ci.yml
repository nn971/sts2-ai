name: parent-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[dev]'
      - run: dotnet build emulator/src/Sts2Emulator.Cli/Sts2Emulator.Cli.csproj -c Release
      - run: >-
          dotnet run
          --project emulator/benchmarks/Sts2Emulator.Microbench/Sts2Emulator.Microbench.csproj
          -c Release
          -- 10000
      - run: python -m ruff check src tests
      - run: python -m mypy src/sts2_ai
      - run: python -m pytest
      - run: >-
          python -m sts2_ai.cli prototype-search-smoke
          --nodes 64
          --depth 8
          --seed ci-search-smoke
