name: parent-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests
      - run: python -m mypy src/sts2_ai
      - run: python -m pytest
      - name: Whole-run baseline smoke
        run: |
          sts2-ai evaluate --agent random --seeds 1 --no-build
          sts2-ai evaluate --agent heuristic --seeds 1 --no-build
          sts2-ai evaluate --agent route --seeds 1 --no-build
      - name: Paired visible-route planning diagnostic
        run: |
          sts2-ai benchmark --budgets --seeds 8 --seed-prefix route-ci \
            --no-include-random --no-build \
            --strategy-db /tmp/sts2-route-benchmark.sqlite
      - name: Small oracle MCTS workload profile
        run: |
          sts2-ai evaluate \
            --agent mcts \
            --budget 8 \
            --rollout-depth 32 \
            --rollout-batch-size 8 \
            --seeds 1 \
            --max-decisions 8 \
            --no-build \
            --profile \
            --cutoff-samples /tmp/sts2-ai-cutoffs.jsonl \
            --cutoff-sample-every 1 \
            --strategy-db /tmp/sts2-ai-strategy.sqlite
          sts2-ai export-training \
            /tmp/sts2-ai-strategy.sqlite /tmp/sts2-ai-roots.jsonl
          sts2-ai diagnose-training \
            /tmp/sts2-ai-roots.jsonl \
            --cutoff-samples /tmp/sts2-ai-cutoffs.jsonl
