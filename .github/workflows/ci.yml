name: parent-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests
      - run: python -m mypy src/sts2_ai
      - run: python -m pytest
      - name: Whole-run baseline smoke
        run: |
          sts2-ai evaluate --agent random --seeds 1 --no-build
          sts2-ai evaluate --agent heuristic --seeds 1 --no-build
      - name: Small oracle MCTS workload profile
        run: |
          sts2-ai evaluate \
            --agent mcts \
            --budget 8 \
            --rollout-depth 32 \
            --rollout-batch-size 8 \
            --seeds 1 \
            --max-decisions 8 \
            --no-build \
            --profile \
            --strategy-db /tmp/sts2-ai-strategy.sqlite

      - name: Persisted five-seed heuristic-payload-fix ladder
        shell: bash
        run: |
          mkdir -p results
          sts2-ai benchmark \
            --budgets 8 32 128 \
            --seeds 5 \
            --rollout-depth 8 \
            --rollout-batch-size 8 \
            --no-build \
            --strategy-db results/strategy.sqlite \
            --json-output results/benchmark.json | tee results/benchmark.md
          sts2-ai strategy-report results/strategy.sqlite --limit 100 \
            --json-output results/strategy-report.json \
            | tee results/strategy-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: heuristic-payload-fix-five-seed-${{ github.run_id }}
          path: |
            results/benchmark.json
            results/benchmark.md
            results/strategy.sqlite
            results/strategy-report.md
            results/strategy-report.json
          if-no-files-found: error
