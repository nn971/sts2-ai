name: parent-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests tools/benchmark_coupled_belief.py
      - run: python -m mypy src/sts2_ai
      - run: python -m pytest
      - name: Reproducible coupled belief survival benchmark
        run: |
          python tools/benchmark_coupled_belief.py \
            --cohorts 16,64 --post-map-decisions 48 \
            --rejection-budget 8 --rejection-probes 3 \
            --json-out /tmp/sts2-coupled-belief.json
          python -c 'import json; from pathlib import Path; r = json.loads(Path("/tmp/sts2-coupled-belief.json").read_text()); assert r["schema"] == "synthetic-overgrowth-coupled-belief-benchmark-v1"; assert len(r["target_phases"]) >= 3; assert len(r["cohorts"]) == 2; assert len(r["fresh_rejection"]) == 3; assert all(c["factorized_runstarts"] == 7 and c["checkpoints"][0]["survivors"] == c["cohort_size"] and all(a["survivors"] >= b["survivors"] for a,b in zip(c["checkpoints"], c["checkpoints"][1:])) for c in r["cohorts"])'
      - uses: actions/upload-artifact@v4
        with:
          name: coupled-belief-survival-profile
          path: /tmp/sts2-coupled-belief.json
      - name: Whole-run baseline smoke
        run: |
          sts2-ai evaluate --agent random --seeds 1 --no-build
          sts2-ai evaluate --agent heuristic --seeds 1 --no-build
          sts2-ai evaluate --agent route --seeds 1 --no-build
      - name: Paired visible-route planning diagnostic
        run: |
          sts2-ai benchmark --budgets --seeds 8 --seed-prefix route-ci \
            --no-include-random --no-build \
            --strategy-db /tmp/sts2-route-benchmark.sqlite
      - name: Small oracle MCTS workload profile
        run: |
          sts2-ai evaluate \
            --agent mcts \
            --budget 8 \
            --shadow-budget 16 \
            --shadow-strategy-db /tmp/sts2-ai-shadow.sqlite \
            --rollout-depth 32 \
            --rollout-batch-size 8 \
            --seeds 1 \
            --max-decisions 8 \
            --no-build \
            --profile \
            --cutoff-samples /tmp/sts2-ai-cutoffs.jsonl \
            --cutoff-sample-every 1 \
            --strategy-db /tmp/sts2-ai-strategy.sqlite
          sts2-ai export-training \
            /tmp/sts2-ai-strategy.sqlite /tmp/sts2-ai-roots.jsonl
          sts2-ai diagnose-training \
            /tmp/sts2-ai-roots.jsonl \
            --cutoff-samples /tmp/sts2-ai-cutoffs.jsonl
          sts2-ai export-training \
            /tmp/sts2-ai-shadow.sqlite /tmp/sts2-ai-shadow-roots.jsonl
          sts2-ai compare-teachers \
            /tmp/sts2-ai-roots.jsonl /tmp/sts2-ai-shadow-roots.jsonl
          python -c 'import json; from pathlib import Path; files = [Path("/tmp/sts2-ai-roots.jsonl"), Path("/tmp/sts2-ai-shadow-roots.jsonl")]; rows = [[json.loads(line) for line in file.read_text().splitlines()] for file in files]; assert all(dataset and all(item["source_run_seeds"] == ["eval-0"] for item in dataset) for dataset in rows), "root run provenance is missing or wrong"'
          sts2-ai distill-consensus-q-teacher \
            /tmp/sts2-ai-roots.jsonl /tmp/sts2-ai-shadow-roots.jsonl \
            /tmp/sts2-ai-consensus-roots.jsonl \
            --min-budget 16 --min-semantic-visits 1 \
            --min-value-gap 0 --min-low-value-gap 0 \
            --json-output /tmp/sts2-ai-consensus-audit.json
          python -c 'import json; from pathlib import Path; r = json.loads(Path("/tmp/sts2-ai-consensus-audit.json").read_text()); assert r["matched_exact_roots"] > 0; assert r["accepted"] <= r["matched_exact_roots"]'
