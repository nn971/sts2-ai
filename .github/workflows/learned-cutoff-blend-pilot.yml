name: learned-cutoff-blend-pilot

on:
  push:
    branches:
      - benchmark/learned-cutoff-blend-pilot

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: heldout-distillation-4seed
          run-id: 37731639664
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input-data
      - name: Recreate the fixed original training-only model
        run: |
          TARGETS="$(find input-data -name 'learning-pilot-targets.jsonl' -print -quit)"
          test -n "$TARGETS"
          sts2-ai validate-linear "$TARGETS" /tmp/cutoff-v2.json \
            --validation-fraction 0.2 --dimension 2048 --epochs 24 --seed 7
      - name: Quarter learned / three-quarters handcrafted
        run: |
          sts2-ai benchmark \
            --budgets 32 --seeds 3 --seed-prefix cutoff-eval \
            --rollout-depth 16 --rollout-batch-size 8 \
            --cutoff-model /tmp/cutoff-v2.json --learned-weight 0.25 \
            --no-include-route --no-include-random \
            --strategy-db /tmp/blend25.sqlite \
            --json-output /tmp/blend25.json
      - name: Half learned / half handcrafted
        run: |
          sts2-ai benchmark \
            --budgets 32 --seeds 3 --seed-prefix cutoff-eval \
            --rollout-depth 16 --rollout-batch-size 8 \
            --cutoff-model /tmp/cutoff-v2.json --learned-weight 0.5 \
            --no-include-route --no-include-random \
            --strategy-db /tmp/blend50.sqlite \
            --json-output /tmp/blend50.json
      - uses: actions/upload-artifact@v4
        with:
          name: learned-cutoff-blend-pilot
          path: |
            /tmp/blend25.json
            /tmp/blend50.json
