name: h16-joint-act-pilot

on:
  push:
    paths:
      - 'src/sts2_ai/training/h16_joint_act_pilot.py'
      - 'src/sts2_ai/training/h16_public_codec.py'
      - 'src/sts2_ai/models/shared_transformer.py'
      - 'src/sts2_ai/emulator/run_environment.py'
      - 'src/sts2_ai/emulator/jsonl_backend.py'
      - 'tools/train_h16_joint_act_pilot.py'
      - 'tests/test_h16_joint_act_pilot.py'
      - '.github/workflows/h16-joint-act-pilot.yml'
  pull_request:
  workflow_dispatch:

jobs:
  joint-pilot-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU Torch and research tests
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Lint and compile pilot
        run: |
          python -m ruff check src/sts2_ai/training/h16_joint_act_pilot.py src/sts2_ai/training/h16_public_codec.py tools/train_h16_joint_act_pilot.py tests/test_h16_joint_act_pilot.py
          python -m compileall -q src/sts2_ai/training/h16_joint_act_pilot.py src/sts2_ai/training/h16_public_codec.py tools/train_h16_joint_act_pilot.py
          python tools/train_h16_joint_act_pilot.py --help > /dev/null
      - name: Test delayed targets, joint optimization, and padded-minibatch stability
        run: python -m pytest -q tests/test_h16_joint_act_pilot.py
