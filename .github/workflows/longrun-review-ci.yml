name: longrun-review-tools

on:
  push:
    paths:
      - "src/sts2_ai/evaluation/baseline_cache.py"
      - "tools/train_phase_split.py"
      - "tools/train_longrun.py"
      - "tools/replay_review_runs.py"
      - "tests/test_longrun_review_tools.py"
      - ".github/workflows/longrun-review-ci.yml"
  pull_request:
    paths:
      - "src/sts2_ai/evaluation/baseline_cache.py"
      - "tools/train_phase_split.py"
      - "tools/train_longrun.py"
      - "tools/replay_review_runs.py"
      - "tests/test_longrun_review_tools.py"
      - ".github/workflows/longrun-review-ci.yml"
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Cache safety and public review formatting
        run: python -m pytest -q tests/test_longrun_review_tools.py
      - name: New files lint
        run: |
          python -m ruff check \
            src/sts2_ai/evaluation/baseline_cache.py \
            tools/replay_review_runs.py \
            tests/test_longrun_review_tools.py
