name: h7-shared-transformer

on:
  push:
    branches:
      - research/h7-shared-transformer-combat-20261027
    paths:
      - 'docs/H7_SHARED_TRANSFORMER_COMBAT.md'
      - 'src/sts2_ai/models/shared_game_objects.py'
      - 'src/sts2_ai/models/shared_transformer.py'
      - 'tests/test_shared_transformer_h7.py'
      - 'tools/probe_h7_transformer.py'
      - '.github/workflows/h7-shared-transformer.yml'
  pull_request:
    paths:
      - 'docs/H7_SHARED_TRANSFORMER_COMBAT.md'
      - 'src/sts2_ai/models/shared_game_objects.py'
      - 'src/sts2_ai/models/shared_transformer.py'
      - 'tests/test_shared_transformer_h7.py'
      - 'tools/probe_h7_transformer.py'
      - '.github/workflows/h7-shared-transformer.yml'
  workflow_dispatch:

jobs:
  h7-codec-transformer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Torch CPU and repository tests
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: H7 isolated lint and unit tests
        run: |
          python -m ruff check src/sts2_ai/models/shared_game_objects.py src/sts2_ai/models/shared_transformer.py tests/test_shared_transformer_h7.py tools/probe_h7_transformer.py
          python -m pytest -q tests/test_shared_transformer_h7.py
      - name: Full-size differentiable architecture probe
        run: |
          python -u tools/probe_h7_transformer.py --width 384 --layers 6 --heads 8 --feedforward 1536 > h7-probe.json
          python - <<'PY'
          import json
          report = json.load(open("h7-probe.json"))
          assert report["parameters"] > 10_000_000
          assert report["finite_loss"] and report["backbone_gradient_nonzero"]
          assert report["legal_action_count"] == 2
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: h7-transformer-probe
          path: h7-probe.json
