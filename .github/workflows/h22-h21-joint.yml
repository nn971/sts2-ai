name: h22-h21-joint-training

on:
  pull_request:
    paths:
      - 'src/sts2_ai/training/h16_joint_act_pilot.py'
      - 'src/sts2_ai/training/h17_replay.py'
      - 'src/sts2_ai/emulator/jsonl_backend.py'
      - 'src/sts2_ai/models/h16_batch_actor.py'
      - 'tools/train_h16_joint_act_pilot.py'
      - 'tools/train_h22_h21_generated_a0.py'
      - 'tools/probe_h22_joint_bridge.py'
      - 'tests/test_h22_h21_joint_training.py'
      - '.github/workflows/h22-h21-joint.yml'
  workflow_dispatch:

jobs:
  h22-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and research tests
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: H22 lint and compile
        run: |
          python -m ruff check src/sts2_ai/training/h16_joint_act_pilot.py src/sts2_ai/training/h17_replay.py src/sts2_ai/emulator/jsonl_backend.py src/sts2_ai/models/h16_batch_actor.py tools/train_h16_joint_act_pilot.py tools/train_h22_h21_generated_a0.py tests/test_h22_h21_joint_training.py
          python -m compileall -q src/sts2_ai/training/h16_joint_act_pilot.py src/sts2_ai/training/h17_replay.py src/sts2_ai/emulator/jsonl_backend.py src/sts2_ai/models/h16_batch_actor.py tools/train_h16_joint_act_pilot.py tools/train_h22_h21_generated_a0.py
      - name: H21 representation, H22 joint and H18 regression
        run: |
          python -m pytest -q tests/test_h22_h21_joint_training.py tests/test_h21_macro_offers.py tests/test_h21_pending_continuations.py tests/test_h21_action_alias_audit.py tests/test_h16_joint_act_pilot.py tests/test_h18_p2_training_stage.py

  h22-live-public-v1-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nn971/sts2-emulator
          ref: fix/h18-public-observation-v1-20261104
          path: emulator-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install CPU joint model
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Build real public-v1 emulator
        run: dotnet build emulator-v1/src/Sts2Emulator.Cli/Sts2Emulator.Cli.csproj -c Release -m:1
      - name: Exercise H22 public-v1 emulator, model and fused Act loop
        run: |
          python tools/probe_h22_joint_bridge.py \
            --emulator-root emulator-v1 --max-decisions 80
      - name: Smoke frozen H22 packed shared actor with real public-v1 PUCT
        run: |
          python -c 'from pathlib import Path; from sts2_ai.models.shared_macro_transformer_v2 import H21GroundedMacroTransformer; from sts2_ai.models.shared_transformer import H7Config; from sts2_ai.training.h16_joint_act_pilot import JointActPilotNet; JointActPilotNet(H21GroundedMacroTransformer(H7Config(width=32, layers=1, heads=4, feedforward=64))).save(Path("h22-ci-frozen-untrained.pt"))'
          python tools/profile_p2_parallel_cohort.py \
            --execute --emulator-root emulator-v1 \
            --emulator-revision "$(git -C emulator-v1 rev-parse HEAD)" \
            --checkpoint h22-ci-frozen-untrained.pt \
            --representation h21 --actor-h21-collator packed \
            --actor-inference shared --actor-device cpu \
            --actor-max-batch 2 --workers 1 \
            --seeds h22-h21-v1-bridge-ci-20261105 \
            --simulations 8 --depth 2 --max-searches 1 \
            --max-decisions 80 --no-episode-profile --paired \
            --output h22-ci-packed-public-v1.json
          python -c 'import json; from pathlib import Path; p = json.loads(Path("h22-ci-packed-public-v1.json").read_text()); assert p["shared_actor_metrics"]["p2_h21_collator"] == "packed"; assert p["search_roots"] > 0; assert all(x["public_teacher_parity"] is True for x in p["seed_reports"]); print(json.dumps({"h22_packed_actor_ci": "pass", "search_roots": p["search_roots"], "transitions": p["search_transitions"], "cohort_wall_seconds": p["cohort_wall_seconds"], "actor_collate_seconds": p["shared_actor_metrics"]["host_collate_seconds"]}, sort_keys=True))'

      - name: Check H22 frozen reference-packed-packed-reference real PUCT parity
        run: |
          python tools/run_p2_actor_abba.py \
            --execute --experiment h21-collator \
            --emulator-root emulator-v1 \
            --emulator-revision "$(git -C emulator-v1 rev-parse HEAD)" \
            --checkpoint h22-ci-frozen-untrained.pt --macro-prior-weight 0 \
            --workers 1 --actor-device cpu --h21-max-batch 4 \
            --seeds h22-h21-v1-bridge-ci-20261105 \
            --simulations 8 --depth 2 --max-searches 1 \
            --max-decisions 80 \
            --output-root results/p2-h22-ci-collator-abba
          python -c 'import json; from pathlib import Path; r = json.loads(Path("results/p2-h22-ci-collator-abba/p2-h22-collator-abba-report.json").read_text()); assert r["parity"]["passed"]; assert r["workload"]["search_transitions_per_run"] > 0; print(json.dumps({"h22_abba_contract": "pass", "matched_seed_count": r["parity"]["seed_count"], "wall_ratio_cpu_untrained_diagnostic": r["ratio_of_total_baseline_to_candidate_wall"], "candidate_faster_in_both_pairs": r["candidate_faster_in_both_pairs"]}, sort_keys=True))'


