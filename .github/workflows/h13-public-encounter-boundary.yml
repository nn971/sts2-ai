name: h13-public-encounter-boundary

on:
  push:
    branches:
      - research/h13-**
  pull_request:
    paths:
      - src/sts2_ai/training/h13_public_transitions.py
      - src/sts2_ai/training/h12_transition_data.py
      - tools/build_h13_encounter_law.py
      - tests/test_h13_public_transitions.py
      - .github/workflows/h13-public-encounter-boundary.yml

jobs:
  public-encounter-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[neural,dev]'
      - name: Compile and lint H13
        run: |
          python -m compileall -q \
            src/sts2_ai/training/h13_public_transitions.py \
            src/sts2_ai/training/h12_transition_data.py \
            tools/build_h13_encounter_law.py \
            tests/test_h13_public_transitions.py
          python -m ruff check \
            src/sts2_ai/training/h13_public_transitions.py \
            src/sts2_ai/training/h12_transition_data.py \
            tools/build_h13_encounter_law.py \
            tests/test_h13_public_transitions.py
      - name: Run public boundary regressions
        run: |
          python -m pytest -q \
            tests/test_h13_public_transitions.py \
            tests/test_h12_joint_outcome.py
