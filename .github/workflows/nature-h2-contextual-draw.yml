name: nature-h2-contextual-draw

on:
  push:
    paths:
      - 'src/sts2_ai/nature/contextual_draw.py'
      - 'src/sts2_ai/nature/draw_only_p0.py'
      - 'src/sts2_ai/nature/draw_only_episode.py'
      - 'src/sts2_ai/nature/two_site_opponent.py'
      - 'src/sts2_ai/nature/draw_only_workers.py'
      - 'tools/train_draw_only_nature_h1.py'
      - 'tools/probe_nature_h2_combat_profiles.py'
      - 'tests/test_nature_contextual_draw.py'
      - 'emulator'
      - '.github/workflows/nature-h2-contextual-draw.yml'
  pull_request:
  workflow_dispatch:

jobs:
  contextual-draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: nn971/sts2-emulator
          ref: b3b26aa1cc2c929f66b346f913f6e5728bcd6b74
          path: emulator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install AI
        working-directory: ai
        run: python -m pip install -e '.[dev]'
      - name: Lint and regression tests
        working-directory: ai
        run: |
          python -m ruff check src/sts2_ai/nature/contextual_draw.py src/sts2_ai/nature/draw_only_p0.py src/sts2_ai/nature/draw_only_episode.py src/sts2_ai/nature/draw_only_workers.py src/sts2_ai/nature/two_site_opponent.py tools/train_draw_only_nature_h1.py tools/probe_nature_h2_combat_profiles.py tests/test_nature_contextual_draw.py
          python -m pytest -q tests/test_nature_contextual_draw.py tests/test_nature_draw_only_law.py tests/test_nature_draw_only_h1.py tests/test_nature_h2_challenge_profiles.py
      - name: Build isolated emulator interface branch
        working-directory: emulator
        run: |
          dotnet restore Sts2Emulator.sln
          dotnet build Sts2Emulator.sln -c Release --no-restore
      - name: Suspended Nature boundary public observation test
        working-directory: emulator
        run: |
          dotnet test tests/Sts2Emulator.Core.Tests/Sts2Emulator.Core.Tests.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~NatureBoundaryPublicViewReusesFairPlayerObservationWithoutHiddenDrawOrder"
      - name: Real contextual draws and exact terminal replay
        working-directory: ai
        run: |
          python -u tools/probe_nature_h2_combat_profiles.py \
            --nature-model contextual \
            --scenarios mawler-a10,cubex-a10,vine-shambler-a10 \
            --emulator-dll ../emulator/src/Sts2Emulator.Cli/bin/Release/net9.0/Sts2Emulator.Cli.dll \
            --emulator-bindings ../emulator/bindings/python \
            --emulator-revision b3b26aa1cc2c929f66b346f913f6e5728bcd6b74
