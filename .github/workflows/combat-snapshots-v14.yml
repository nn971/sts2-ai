name: combat-snapshots-v14

on:
  push:
    paths:
      - "src/sts2_ai/evaluation/combat_snapshots.py"
      - "tools/combat_snapshot_benchmark.py"
      - "tools/compare_combat_snapshots_v14.py"
      - "tests/test_combat_snapshots_v14.py"
      - ".github/workflows/combat-snapshots-v14.yml"
  pull_request:
    paths:
      - "src/sts2_ai/evaluation/combat_snapshots.py"
      - "tools/combat_snapshot_benchmark.py"
      - "tools/compare_combat_snapshots_v14.py"
      - "tests/test_combat_snapshots_v14.py"
      - ".github/workflows/combat-snapshots-v14.yml"
  workflow_dispatch:

jobs:
  snapshot-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Lint v14
        run: |
          python -m ruff check \
            src/sts2_ai/evaluation/combat_snapshots.py \
            tools/combat_snapshot_benchmark.py \
            tools/compare_combat_snapshots_v14.py \
            tests/test_combat_snapshots_v14.py
      - name: Replay contract and phase-matching tests
        run: python -m pytest -q tests/test_combat_snapshots_v14.py
