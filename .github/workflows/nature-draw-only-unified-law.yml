name: nature-draw-only-unified-law

on:
  push:
    paths:
      - 'src/sts2_ai/nature/draw_only_p0.py'
      - 'src/sts2_ai/nature/draw_only_episode.py'
      - 'src/sts2_ai/nature/draw_only_workers.py'
      - 'tools/probe_nature_draw_only.py'
      - 'tools/train_draw_only_nature_h1.py'
      - 'tests/test_nature_draw_only_law.py'
      - 'tests/test_nature_draw_only_h1.py'
      - 'docs/NATURE_DRAW_ONLY_SERIOUS_COMBAT_PLAN.md'
      - '.github/workflows/nature-draw-only-unified-law.yml'
  pull_request:
    paths:
      - 'src/sts2_ai/nature/draw_only_p0.py'
      - 'src/sts2_ai/nature/draw_only_episode.py'
      - 'src/sts2_ai/nature/draw_only_workers.py'
      - 'tools/probe_nature_draw_only.py'
      - 'tools/train_draw_only_nature_h1.py'
      - 'tests/test_nature_draw_only_law.py'
      - 'tests/test_nature_draw_only_h1.py'
      - 'docs/NATURE_DRAW_ONLY_SERIOUS_COMBAT_PLAN.md'
      - '.github/workflows/nature-draw-only-unified-law.yml'
  workflow_dispatch:

jobs:
  declared-law-draw-only-combat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai
      - uses: actions/checkout@v4
        with:
          repository: nn971/sts2-emulator
          ref: da847bf17c01feba66e833a22e0986d2f906c619
          path: emulator
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AI test environment
        working-directory: ai
        run: python -m pip install -e '.[dev]'
      - name: Ruff and independent declared-law tests
        working-directory: ai
        run: |
          python -m ruff check src/sts2_ai/nature/draw_only_p0.py src/sts2_ai/nature/draw_only_episode.py src/sts2_ai/nature/draw_only_workers.py tools/probe_nature_draw_only.py tools/train_draw_only_nature_h1.py tests/test_nature_draw_only_law.py tests/test_nature_draw_only_h1.py
          python -m pytest -q tests/test_nature_draw_only_law.py tests/test_nature_draw_only_h1.py
      - name: Build exactly pinned unified-Chance-Law emulator
        working-directory: emulator
        run: |
          dotnet restore Sts2Emulator.sln
          dotnet build Sts2Emulator.sln -c Release --no-restore
      - name: Real C# combat with Chance Law, external draw-only Nature and exact replay
        working-directory: ai
        run: |
          python -u tools/probe_nature_draw_only.py \
            --emulator-dll ../emulator/src/Sts2Emulator.Cli/bin/Release/net9.0/Sts2Emulator.Cli.dll \
            --emulator-bindings ../emulator/bindings/python \
            --emulator-revision da847bf17c01feba66e833a22e0986d2f906c619 \
            --source-seed nature-p0-weak-real-victory \
            --entry-mode seeded-fixed-shrinker \
            --region Overgrowth --min-draw-choices 1 \
            --output /tmp/nature-draw-only-unified-probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('/tmp/nature-draw-only-unified-probe.json').read_text())
          assert row['source_chance_law'] == 'UNVERIFIED'
          assert row['performance_evidence'] is False
          assert row['nontrivial_draw_count'] > 0
          assert row['trace_digest'] == row['replay_digest']
          assert row['outcome'] in ('victory', 'defeat')
          print('[nature-draw-only] PASS real C# integration, no performance claim')
          PY
      - name: Independent source replay with pure Reference draw law
        working-directory: ai
        run: |
          python -u tools/probe_nature_draw_only.py \
            --emulator-dll ../emulator/src/Sts2Emulator.Cli/bin/Release/net9.0/Sts2Emulator.Cli.dll \
            --emulator-bindings ../emulator/bindings/python \
            --emulator-revision da847bf17c01feba66e833a22e0986d2f906c619 \
            --source-seed nature-p0-weak-real-victory \
            --entry-mode seeded-fixed-shrinker --draw-mode reference \
            --region Overgrowth --min-draw-choices 1 \
            --output /tmp/nature-draw-only-reference-probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          control = json.loads(Path('/tmp/nature-draw-only-reference-probe.json').read_text())
          nature = json.loads(Path('/tmp/nature-draw-only-unified-probe.json').read_text())
          assert control['draw_mode'] == 'reference'
          assert nature['draw_mode'] == 'learned'
          assert control['source_opening_fingerprint'] == nature['source_opening_fingerprint']
          assert control['reference_intent_count'] > 0
          assert control['nontrivial_draw_count'] > 0
          assert control['trace_digest'] == control['replay_digest']
          print('[nature-draw-only] PASS exact-law reference vs learned source opening')
          PY
