name: h21-live-power-v2

on:
  pull_request:
    paths:
      - 'src/sts2_ai/training/h19_resource_codec.py'
      - 'src/sts2_ai/training/h21_macro_offer_codec.py'
      - 'tests/test_h21_enemy_powers_v2.py'
      - 'tools/probe_h21_live_public.py'
      - 'tools/check_h21_v2_observation_parity.py'
      - '.github/workflows/h21-live-power-v2.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-enemy-power-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nn971/sts2-emulator
          # P1 canonical-only enemy effect storage, old snapshot adapter accepted.
          ref: 252ca624ff52885d4eedc78b818eda75a9eafb89
          path: emulator-p1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install H21 codec
        run: python -m pip install -e .
      - name: Build opt-in canonical-power emulator
        run: dotnet build emulator-p1/src/Sts2Emulator.Cli/Sts2Emulator.Cli.csproj -c Release
      - name: Exercise canonical v2 frames with generated A0 combats
        run: |
          python tools/probe_h21_live_public.py \
            --emulator-dll emulator-p1/src/Sts2Emulator.Cli/bin/Release/net9.0/Sts2Emulator.Cli.dll \
            --canonical-enemy-powers --strict \
            --prefer-enemy-debuff-cards \
            --require-observed-enemy-power proto.power.weak \
            --require-observed-enemy-power proto.power.poison \
            --seed p1-power-v2-coverage-a --seed p1-power-v2-coverage-b \
            --max-decisions 100 > h21-live-power-v2.json
          cat h21-live-power-v2.json
      - name: Check legacy and canonical mode observation parity
        run: |
          python tools/check_h21_v2_observation_parity.py \
            --emulator-dll emulator-p1/src/Sts2Emulator.Cli/bin/Release/net9.0/Sts2Emulator.Cli.dll \
            --seed p1-power-v2-coverage-a --seed p1-power-v2-coverage-b \
            --snapshot-every 13 --require-positive-snapshot \
            --max-decisions 100 > h21-v2-observation-parity.json
          cat h21-v2-observation-parity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h21-live-power-v2
          path: |
            h21-live-power-v2.json
            h21-v2-observation-parity.json
          if-no-files-found: warn
