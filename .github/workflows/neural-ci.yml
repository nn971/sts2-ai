name: neural-cpu-smoke

on:
  push:
    paths:
      - "src/sts2_ai/models/**"
      - "src/sts2_ai/training/neural.py"
      - "tests/test_neural_policy_value.py"
      - "tests/test_q_policy_targets.py"
      - "pyproject.toml"
      - ".github/workflows/neural-ci.yml"
  pull_request:
    paths:
      - "src/sts2_ai/models/**"
      - "src/sts2_ai/training/neural.py"
      - "tests/test_neural_policy_value.py"
      - "pyproject.toml"
      - ".github/workflows/neural-ci.yml"
  workflow_dispatch:

jobs:
  neural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and test tools
        run: python -m pip install -e '.[dev]'
      - name: Neural training, CLI and weight portability
        run: python -m pytest tests/test_neural_policy_value.py tests/test_q_policy_targets.py -q
