name: h24-hard-resource-value

on:
  pull_request:
    paths:
      - 'src/sts2_ai/training/h24_*.py'
      - 'src/sts2_ai/training/h16_joint_act_pilot.py'
      - 'src/sts2_ai/models/h16_batch_actor.py'
      - 'tools/train_h16_joint_act_pilot.py'
      - 'tools/train_h24_hard_resources_a0.py'
      - 'tests/test_h24_*.py'
      - '.github/workflows/h24-hard-resource-value.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  h24-isolated-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU Torch and testing environment
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Lint and compile only H24 changes
        run: |
          python -m ruff check src/sts2_ai/training/h24_*.py tests/test_h24_*.py tools/train_h24_hard_resources_a0.py
          python -m compileall -q src/sts2_ai/training/h24_applicability.py src/sts2_ai/training/h24_neutral_value.py src/sts2_ai/training/h24_resource_monotone.py src/sts2_ai/training/h24_joint_act_model.py tools/train_h24_hard_resources_a0.py
      - name: H24 audit, exact neutral context and paired model tests
        run: |
          python -m pytest -q tests/test_h24_applicability.py tests/test_h24_neutral_value.py tests/test_h24_resource_monotone.py tests/test_h24_joint_act_model.py
