name: nature-h2-conditioned-combat-profiles

on:
  push:
    paths:
      - 'src/sts2_ai/nature/combat_scenarios.py'
      - 'src/sts2_ai/nature/draw_only_episode.py'
      - 'src/sts2_ai/nature/draw_only_workers.py'
      - 'tests/test_nature_h2_challenge_profiles.py'
      - 'tools/probe_nature_h2_combat_profiles.py'
      - 'tools/train_draw_only_nature_h1.py'
      - 'tools/benchmark_nature_h1_frozen_players.py'
      - '.github/workflows/nature-h2-conditioned-combat-profiles.yml'
  pull_request:
    paths:
      - 'src/sts2_ai/nature/combat_scenarios.py'
      - 'src/sts2_ai/nature/draw_only_episode.py'
      - 'src/sts2_ai/nature/draw_only_workers.py'
      - 'tests/test_nature_h2_challenge_profiles.py'
      - 'tools/probe_nature_h2_combat_profiles.py'
      - 'tools/train_draw_only_nature_h1.py'
      - 'tools/benchmark_nature_h1_frozen_players.py'
      - '.github/workflows/nature-h2-conditioned-combat-profiles.yml'
  workflow_dispatch:

jobs:
  h2-context-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai
      - uses: actions/checkout@v4
        with:
          repository: nn971/sts2-emulator
          ref: 5a332c2caa889b9b3f6e326bc054d6dcec019289
          path: emulator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install AI
        working-directory: ai
        run: python -m pip install -e '.[dev]'
      - name: Python layout, source partitions, replay tests
        working-directory: ai
        run: |
          python -m ruff check src/sts2_ai/nature/combat_scenarios.py src/sts2_ai/nature/draw_only_episode.py src/sts2_ai/nature/draw_only_workers.py tools/probe_nature_h2_combat_profiles.py tools/benchmark_nature_h1_frozen_players.py tools/train_draw_only_nature_h1.py tests/test_nature_h2_challenge_profiles.py
          python -m pytest -q tests/test_nature_h2_challenge_profiles.py tests/test_nature_draw_only_player_choice.py tests/test_nature_h1_frozen_model_reuse.py tests/test_nature_draw_only_h1.py
      - name: Build source-pinned emulator
        working-directory: emulator
        run: |
          dotnet restore Sts2Emulator.sln
          dotnet build Sts2Emulator.sln -c Release --no-restore
      - name: Real alternate conditioned combat and terminal replay
        working-directory: ai
        run: |
          python -u tools/probe_nature_h2_combat_profiles.py \
            --emulator-dll ../emulator/src/Sts2Emulator.Cli/bin/Release/net9.0/Sts2Emulator.Cli.dll \
            --emulator-bindings ../emulator/bindings/python \
            --emulator-revision 5a332c2caa889b9b3f6e326bc054d6dcec019289

      - name: Real C# conditioned deck full-combat and replay gate
        working-directory: ai
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '../emulator/bindings/python')
          from sts2_emulator import Session
          from sts2_ai.nature.combat_scenarios import SCENARIOS, DECK_PRESETS
          from sts2_ai.nature.draw_only_episode import play_draw_only_episode
          from sts2_ai.nature.two_site_opponent import TwoSiteNature
          from sts2_ai.emulator.semantic_p0_combat import strike_first_player
          cmd = ['dotnet', '../emulator/src/Sts2Emulator.Cli/bin/Release/net9.0/Sts2Emulator.Cli.dll', 'prototype-ai-jsonl']
          with Session(cmd) as session:
              for deck in DECK_PRESETS:
                  opts = dict(source_seed='h2-ci-deck-'+deck, reference_seed=88,
                              nature=TwoSiteNature(seed=7), emulator_revision='5a332c2caa889b9b3f6e326bc054d6dcec019289',
                              player_choose=strike_first_player, player_model_id='test-only-strike-first',
                              entry_mode='seeded-fixed-shrinker', draw_mode='reference',
                              scenario=SCENARIOS['shrinker-a10'], deck_preset_id=deck)
                  one = play_draw_only_episode(session, **opts)
                  two = play_draw_only_episode(session, **{**opts, 'replay': one.decisions})
                  assert one.digest == two.digest and one.nontrivial_draw_count > 0
                  print(f'[nature-h2] deck={deck} outcome={one.outcome} hp={one.exit_hp} draws={one.nontrivial_draw_count} replay=PASS', flush=True)
          PY
