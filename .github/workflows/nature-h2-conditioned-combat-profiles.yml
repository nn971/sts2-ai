name: nature-h2-conditioned-combat-profiles

on:
  push:
    paths:
      - 'src/sts2_ai/nature/combat_scenarios.py'
      - 'src/sts2_ai/nature/draw_only_episode.py'
      - 'src/sts2_ai/nature/draw_only_workers.py'
      - 'tests/test_nature_h2_challenge_profiles.py'
      - 'tools/probe_nature_h2_combat_profiles.py'
      - 'tools/train_draw_only_nature_h1.py'
      - 'tools/benchmark_nature_h1_frozen_players.py'
      - '.github/workflows/nature-h2-conditioned-combat-profiles.yml'
  pull_request:
    paths:
      - 'src/sts2_ai/nature/combat_scenarios.py'
      - 'src/sts2_ai/nature/draw_only_episode.py'
      - 'src/sts2_ai/nature/draw_only_workers.py'
      - 'tests/test_nature_h2_challenge_profiles.py'
      - 'tools/probe_nature_h2_combat_profiles.py'
      - 'tools/train_draw_only_nature_h1.py'
      - 'tools/benchmark_nature_h1_frozen_players.py'
      - '.github/workflows/nature-h2-conditioned-combat-profiles.yml'
  workflow_dispatch:

jobs:
  h2-context-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai
      - uses: actions/checkout@v4
        with:
          repository: nn971/sts2-emulator
          ref: 3636d274cb5c0160d0b0e358b768dec83705201f
          path: emulator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install AI
        working-directory: ai
        run: python -m pip install -e '.[dev]'
      - name: Python layout, source partitions, replay tests
        working-directory: ai
        run: |
          python -m ruff check src/sts2_ai/nature/combat_scenarios.py src/sts2_ai/nature/draw_only_episode.py src/sts2_ai/nature/draw_only_workers.py tools/probe_nature_h2_combat_profiles.py tools/benchmark_nature_h1_frozen_players.py tools/train_draw_only_nature_h1.py tests/test_nature_h2_challenge_profiles.py
          python -m pytest -q tests/test_nature_h2_challenge_profiles.py tests/test_nature_draw_only_player_choice.py tests/test_nature_h1_frozen_model_reuse.py tests/test_nature_draw_only_h1.py
      - name: Build source-pinned emulator
        working-directory: emulator
        run: |
          dotnet restore Sts2Emulator.sln
          dotnet build Sts2Emulator.sln -c Release --no-restore
      - name: Real alternate conditioned combat and terminal replay
        working-directory: ai
        run: |
          python -u tools/probe_nature_h2_combat_profiles.py \
            --emulator-dll ../emulator/src/Sts2Emulator.Cli/bin/Release/net9.0/Sts2Emulator.Cli.dll \
            --emulator-bindings ../emulator/bindings/python \
            --emulator-revision 3636d274cb5c0160d0b0e358b768dec83705201f
