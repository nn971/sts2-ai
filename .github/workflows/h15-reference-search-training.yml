name: h15-reference-search-training

on:
  push:
    paths:
      - 'tools/train_h15_reference_rounds.py'
      - 'tools/audit_h15_reference_search.py'
      - 'tools/probe_h15_reference_search_budget.py'
      - 'tools/probe_h15_final_turn.py'
      - 'tools/run_h15_h8_feedback_cycle.py'
      - 'tools/train_h15_search_distill.py'
      - 'src/sts2_ai/training/h15_native_search_collector.py'
      - 'src/sts2_ai/training/h15_search_supervision.py'
      - 'src/sts2_ai/emulator/h15_h8_reference.py'
      - 'tests/test_h15_feedback_cycle.py'
      - 'tests/test_h15_native_search_collector.py'
      - 'tests/test_h15_reference_search_audit.py'
      - 'tests/test_h15_reference_search_budget.py'
      - 'tests/test_h15_final_turn_probe.py'
      - 'tests/test_h15_late_value_training.py'
      - 'tests/test_h15_root_conditioned_search.py'
      - 'tests/test_h15_m17_reward_search.py'
      - 'src/sts2_ai/nature/h4_reward.py'
      - 'src/sts2_ai/search/combat_puct.py'
      - 'src/sts2_ai/search/h15_public_combat_adapter.py'
      - '.github/workflows/h15-reference-search-training.yml'
  pull_request:
  workflow_dispatch:

jobs:
  reference-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU neural dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Check the new search-training entry point and contracts
        run: |
          python -m compileall -q tools/train_h15_reference_rounds.py
          python -m compileall -q tools/run_h15_h8_feedback_cycle.py
          python -m compileall -q tools/audit_h15_reference_search.py
          python -m compileall -q tools/probe_h15_reference_search_budget.py
          python -m compileall -q tools/probe_h15_final_turn.py
          python tools/probe_h15_final_turn.py --help > /dev/null
          python tools/probe_h15_reference_search_budget.py --help > /dev/null
          python tools/audit_h15_reference_search.py --help > /dev/null
          python -m ruff check \
            tools/train_h15_reference_rounds.py \
            tools/audit_h15_reference_search.py \
            tools/probe_h15_reference_search_budget.py \
            tools/probe_h15_final_turn.py \
            tools/run_h15_h8_feedback_cycle.py \
            tools/train_h15_search_distill.py \
            src/sts2_ai/training/h15_search_supervision.py
      - name: Focused search and optimizer contracts
        run: |
          python -m pytest -q \
            tests/test_h15_feedback_cycle.py \
            tests/test_h15_native_search_collector.py \
            tests/test_h15_reference_search_audit.py \
            tests/test_h15_reference_search_budget.py \
            tests/test_h15_final_turn_probe.py \
            tests/test_h15_late_value_training.py \
            tests/test_h15_root_conditioned_search.py \
            tests/test_h15_m17_reward_search.py \
            tests/test_h15_combat_search.py
