name: neural-selfplay-smoke

on:
  push:
  pull_request:

jobs:
  teacher-free-selfplay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[dev]'
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Validate real learning and terminal censorship
        run: python -m pytest tests/test_neural_selfplay.py tests/test_run_environment.py tests/test_neural_temperature_diagnostics.py tests/test_neural_training_temperature.py tests/test_training_progress.py tests/test_checkpoint_weight_export.py -q
      - name: Actual Silent whole-run neural training and heldout evaluation
        run: |
          python tools/train_selfplay.py \
            --build \
            --environment legacy-prototype \
            --rounds 2 --episodes 3 \
            --workers 2 --checkpoint /tmp/sts2-selfplay-checkpoint.pt \
            --max-decisions 1024 --dimension 64 --hidden 8 \
            --evaluate-seeds 2 --seed 19 \
            --output /tmp/sts2-selfplay-model.json \
            --report /tmp/sts2-selfplay-report.json
          python -c 'import json; from pathlib import Path; r=json.loads(Path("/tmp/sts2-selfplay-report.json").read_text()); m=json.loads(Path("/tmp/sts2-selfplay-model.json").read_text()); assert r["schema"]=="sts2-onpolicy-neural-training-smoke-v2"; assert r["policy_information"]=="prototype-fair-v0"; assert r["training_environment"]=="legacy-prototype"; assert sum(x["played"] for x in r["rounds"])==6; assert r["gradient_updates"]==2, "One update per fresh on-policy round"; assert r["gradient_decision_samples"]>0; assert r["rollout_workers"]==2; assert Path("/tmp/sts2-selfplay-checkpoint.pt").is_file(); assert all(row["auxiliary_coefficient"]==0.4 for row in r["rounds"]) if sum(row["wins"] for row in r["rounds"])==0 else True; assert m["value_head_trained"] is True; assert set(r["heldout_evaluation"])=={"random","heuristic","initial_neural_greedy","neural_greedy"}; assert all(len(v)==2 for v in r["heldout_evaluation"].values()); assert all(x["completed"]+x["censored"]==2 for x in r["heldout_completed_only"].values())'
      - name: Export portable learned checkpoint model without touching source
        run: |
          python tools/export_selfplay_checkpoint_model.py \
            --checkpoint /tmp/sts2-selfplay-checkpoint.pt \
            --output /tmp/sts2-selfplay-recovered-model.json
          python -c 'import json; from pathlib import Path; m=json.loads(Path("/tmp/sts2-selfplay-recovered-model.json").read_text()); assert m["model_id"].startswith("checkpoint-round2-"); assert m["format"]=="sts2-neural-policy-value-v2-semantic-action"; assert m["value_head_trained"] is True'
      - name: Native-structure Overgrowth public gameplay and card rewards
        run: |
          python tools/smoke_native_overgrowth.py \
            --runs 2 --max-decisions 2048 \
            --report /tmp/sts2-native-overgrowth-smoke.json
          python -c 'import json; from pathlib import Path; r=json.loads(Path("/tmp/sts2-native-overgrowth-smoke.json").read_text()); assert r["environment"]=="native-overgrowth"; assert len(r["runs"])==2; assert r["total_card_reward_menus"]>0; assert r["total_card_rewards_taken"]>0'
      - name: First real native-Overgrowth neural optimizer update
        run: |
          python tools/train_selfplay.py \
            --environment native-overgrowth \
            --workers 2 --rounds 1 --episodes 2 \
            --max-decisions 2048 --dimension 64 --hidden 8 \
            --evaluate-seeds 1 --seed 23 \
            --checkpoint /tmp/sts2-native-train-checkpoint.pt \
            --output /tmp/sts2-native-train-model.json \
            --report /tmp/sts2-native-train-report.json
          python -c 'import json; from pathlib import Path; r=json.loads(Path("/tmp/sts2-native-train-report.json").read_text()); assert r["training_environment"]=="native-overgrowth"; assert r["gradient_updates"]>0; assert r["gradient_decision_samples"]>0; assert r["train_completed"]>0'
      - name: Paired temperature and floor-16 public diagnostic smoke
        run: |
          python tools/diagnose_neural_policy.py \
            --model /tmp/sts2-native-train-model.json \
            --report /tmp/sts2-native-temperature-diagnostics.json \
            --runs 2 --temperatures 1 0.5 greedy \
            --max-decisions 2048 --max-boss-actions 8
          python -c 'import json; from pathlib import Path; r=json.loads(Path("/tmp/sts2-native-temperature-diagnostics.json").read_text()); assert r["schema"]=="sts2-neural-temperature-diagnostics-v1"; assert r["environment"]=="native-overgrowth"; assert r["temperatures"]==["t1","t0.5","greedy"]; assert all(x["attempted"]==2 for x in r["summary"].values()); assert all(len(x)==2 for x in r["runs"].values()); assert len(r["paired_completed_only"])==2'
      - name: Warm-start a native on-policy temperature-scheduled training cohort
        run: |
          python tools/train_selfplay.py \
            --environment native-overgrowth \
            --initialize-from-model /tmp/sts2-native-train-model.json \
            --workers 2 --rounds 2 --episodes 3 \
            --temperature-start 0.2 --temperature-end 0.05 \
            --temperature-decay-rounds 1 --entropy-weight 0.002 \
            --max-decisions 2048 --dimension 64 --hidden 8 \
            --evaluate-seeds 1 --seed 47 \
            --checkpoint /tmp/sts2-native-tempered-checkpoint.pt \
            --output /tmp/sts2-native-tempered-model.json \
            --report /tmp/sts2-native-tempered-report.json
          python -c 'import json; from pathlib import Path; r=json.loads(Path("/tmp/sts2-native-tempered-report.json").read_text()); assert r["train_completed"]>0; assert r["gradient_updates"]==2; assert [round(x["sampling_temperature"],6) for x in r["rounds"]]==[0.2,0.05]; assert r["initialized_from_model"]=="/tmp/sts2-native-train-model.json"; assert Path("/tmp/sts2-native-tempered-checkpoint.pt").exists()'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-neural-selfplay
          path: |
            /tmp/sts2-selfplay-model.json
            /tmp/sts2-selfplay-recovered-model.json
            /tmp/sts2-selfplay-report.json
            /tmp/sts2-selfplay-checkpoint.pt
            /tmp/sts2-native-overgrowth-smoke.json
            /tmp/sts2-native-train-report.json
            /tmp/sts2-native-train-model.json
            /tmp/sts2-native-train-checkpoint.pt
            /tmp/sts2-native-temperature-diagnostics.json
            /tmp/sts2-native-tempered-report.json
            /tmp/sts2-native-tempered-model.json
            /tmp/sts2-native-tempered-checkpoint.pt
          if-no-files-found: ignore
