name: h6e-deep-macro-attention

on:
  push:
    paths:
      - 'src/sts2_ai/models/enemy_attention.py'
      - 'src/sts2_ai/training/enemy_attention.py'
      - 'src/sts2_ai/models/macro_objects.py'
      - 'src/sts2_ai/models/neural.py'
      - 'src/sts2_ai/models/phase_split.py'
      - 'src/sts2_ai/training/macro_attention.py'
      - 'src/sts2_ai/training/phase_split_ppo_batch.py'
      - 'src/sts2_ai/training/phase_split_selfplay.py'
      - 'tools/train_phase_split.py'
      - 'tests/test_h6e_deep_macro_attention.py'
      - 'src/sts2_ai/evaluation/macro_trace.py'
      - 'tools/replay_h6_macro.py'
      - 'tests/test_h6c_macro_trace.py'
      - '.github/workflows/h6e-deep-macro-attention.yml'
  pull_request:
  workflow_dispatch:

jobs:
  deep-macro:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Ruff touched Python
        run: |
          python -m ruff check src/sts2_ai/models/enemy_attention.py src/sts2_ai/training/enemy_attention.py src/sts2_ai/models/macro_objects.py src/sts2_ai/models/neural.py src/sts2_ai/models/phase_split.py src/sts2_ai/training/macro_attention.py src/sts2_ai/training/phase_split_ppo_batch.py src/sts2_ai/training/phase_split_selfplay.py tools/train_phase_split.py tests/test_h6e_deep_macro_attention.py src/sts2_ai/evaluation/macro_trace.py tools/replay_h6_macro.py tests/test_h6c_macro_trace.py
      - name: Deep macro, semantic and frozen-combat parity
        run: |
          python -m pytest -q tests/test_h6e_deep_macro_attention.py tests/test_h6d_semantic_macro_actions.py tests/test_h6c_macro_attention.py tests/test_h6_frozen_combat_macro.py tests/test_phase_split_ppo_batch.py tests/test_h6c_macro_trace.py
