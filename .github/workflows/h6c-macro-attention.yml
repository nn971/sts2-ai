name: h6c-macro-attention

on:
  push:
    paths:
      - 'src/sts2_ai/models/macro_objects.py'
      - 'src/sts2_ai/models/neural.py'
      - 'src/sts2_ai/models/phase_split.py'
      - 'src/sts2_ai/training/macro_attention.py'
      - 'src/sts2_ai/training/phase_split_selfplay.py'
      - 'src/sts2_ai/training/phase_split_ppo_batch.py'
      - 'tools/train_phase_split.py'
      - 'tests/test_h6c_macro_attention.py'
      - '.github/workflows/h6c-macro-attention.yml'
  pull_request:
  workflow_dispatch:

jobs:
  macro-attention:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Torch and project
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Check touched code
        run: |
          python -m ruff check src/sts2_ai/models/macro_objects.py src/sts2_ai/models/neural.py src/sts2_ai/models/phase_split.py src/sts2_ai/training/macro_attention.py src/sts2_ai/training/phase_split_selfplay.py src/sts2_ai/training/phase_split_ppo_batch.py tools/train_phase_split.py tests/test_h6c_macro_attention.py
      - name: Run focused regression and numerical parity
        run: |
          python -m pytest -q tests/test_h6c_macro_attention.py tests/test_h6_frozen_combat_macro.py tests/test_phase_split_ppo_batch.py
