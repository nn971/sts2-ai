name: normalized-linear-v2

on:
  push:
    branches:
      - benchmark/normalized-linear-v2

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: heldout-distillation-4seed
          run-id: 37731639664
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input-data
      - name: Validate on the identical four-seed dataset
        run: |
          TARGETS="$(find input-data -name 'learning-pilot-targets.jsonl' -print -quit)"
          test -n "$TARGETS"
          echo "=== V2 8 EPOCHS ==="
          sts2-ai validate-linear "$TARGETS" /tmp/model-v2-e8.json \
            --validation-fraction 0.2 \
            --dimension 2048 \
            --epochs 8 \
            --seed 7
          echo "=== V2 24 EPOCHS ==="
          sts2-ai validate-linear "$TARGETS" /tmp/model-v2-e24.json \
            --validation-fraction 0.2 \
            --dimension 2048 \
            --epochs 24 \
            --seed 7
