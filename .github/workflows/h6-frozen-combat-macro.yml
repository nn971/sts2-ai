name: h6-frozen-combat-macro

on:
  push:
    paths:
      - 'src/sts2_ai/training/phase_split_selfplay.py'
      - 'tools/train_phase_split.py'
      - 'tests/test_h6_frozen_combat_macro.py'
      - '.github/workflows/h6-frozen-combat-macro.yml'
  pull_request:
  workflow_dispatch:

jobs:
  frozen-combat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Lint H6 code
        run: |
          python -m ruff check tests/test_h6_frozen_combat_macro.py
      - name: Train and resume with immutable combat in toy emulator
        run: |
          python -m pytest -q tests/test_h6_frozen_combat_macro.py
