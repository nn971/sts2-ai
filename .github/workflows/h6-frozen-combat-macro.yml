name: h6-frozen-combat-macro

on:
  push:
    paths:
      - 'src/sts2_ai/training/frozen_macro.py'
      - 'src/sts2_ai/training/h6_sources.py'
      - 'src/sts2_ai/training/selfplay.py'
      - 'src/sts2_ai/emulator/run_environment.py'
      - 'tests/test_run_environment.py'
      - 'src/sts2_ai/training/parallel_rollouts.py'
      - 'tools/train_frozen_macro_h6.py'
      - 'tools/evaluate_frozen_macro_h6.py'
      - 'tests/test_h6_frozen_macro.py'
      - '.github/workflows/h6-frozen-combat-macro.yml'
  pull_request:
  workflow_dispatch:

jobs:
  macro-real-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: nn971/sts2-emulator
          ref: e56779ccd86725582af580925ca8242826ba2229
          path: emulator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install dependencies
        working-directory: ai
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: H6 focused lint and public rollout regressions
        working-directory: ai
        run: |
          python -m ruff check src/sts2_ai/training/frozen_macro.py src/sts2_ai/training/h6_sources.py tools/train_frozen_macro_h6.py tools/evaluate_frozen_macro_h6.py tests/test_h6_frozen_macro.py
          python -m pytest -q tests/test_h6_frozen_macro.py tests/test_phase_split_selfplay.py tests/test_neural_selfplay.py tests/test_run_environment.py
      - name: Build unchanged pinned emulator
        working-directory: emulator
        run: |
          dotnet restore Sts2Emulator.sln
          dotnet build Sts2Emulator.sln -c Release --no-restore
      - name: Real native Overgrowth A10 frozen-combat smoke
        working-directory: ai
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0, 'tests')
          from test_nature_h3_joint_player import specimen
          with open('ci-h6-start.json', 'w') as f:
              json.dump(specimen().to_dict(), f)
          PY
          python -u tools/train_frozen_macro_h6.py \
            --player-model ci-h6-start.json \
            --repo-root . --emulator-root ../emulator \
            --emulator-revision e56779ccd86725582af580925ca8242826ba2229 \
            --output-root ci-h6-macro --rounds 1 \
            --episodes-per-round 2 --eval-every 1 --eval-episodes 2 \
            --workers 2 --max-decisions 600 --execute
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('ci-h6-macro/progress.json').read_text())
          assert len(data['rows']) == 1
          row=data['rows'][0]
          assert row['frozen_combat_sha256'] == data['config']['frozen_combat_sha256']
          assert row['combat_optimizer_steps'] == 0
          assert row['train']['runs'] == 2
          assert row['selection']['runs'] == 2
          assert Path('ci-h6-macro/macro-checkpoint.pt').is_file()
          original=json.loads(Path('ci-h6-start.json').read_text())
          final=json.loads(Path('ci-h6-macro/player_models/player-r0001.json').read_text())
          assert original['combat'] == final['combat']
          PY
      - name: Real run-level paired evaluation
        working-directory: ai
        run: |
          python -u tools/evaluate_frozen_macro_h6.py \
            --player initial=ci-h6-start.json \
            --player trained=ci-h6-macro/player_models/player-r0001.json \
            --repo-root . --emulator-root ../emulator \
            --emulator-revision e56779ccd86725582af580925ca8242826ba2229 \
            --output ci-h6-confirmation.json --split confirmation \
            --eval-episodes 2 --workers 2 --max-decisions 600 --execute
          python - <<'PY'
          import json
          data=json.load(open('ci-h6-confirmation.json'))
          assert data['complete']
          assert 'trained-minus-initial' in data['comparisons']
          assert data['config']['ascension'] == 10
          PY
