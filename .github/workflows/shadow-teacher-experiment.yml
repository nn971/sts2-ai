name: matched-root-q-policy-six-seed
# Q-supervision v2 excludes unrepresentable neural action labels.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/shadow-teacher-experiment.yml"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and pinned emulator
        run: |
          python -m pip install -e '.[dev]'
          dotnet build emulator/src/Sts2Emulator.Cli/Sts2Emulator.Cli.csproj \
            --configuration Release --nologo --verbosity quiet
          mkdir -p results/shadow
      - name: Evaluate low-budget agent and high-budget passive teacher on identical roots
        run: |
          sts2-ai evaluate \
            --agent mcts --budget 12 --shadow-budget 96 \
            --rollout-depth 24 --rollout-batch-size 8 \
            --seeds 4 --max-decisions 40 --seed-prefix matched-teacher \
            --no-build --strategy-db results/shadow/low.sqlite \
            --shadow-strategy-db results/shadow/high.sqlite \
            --json-output results/shadow/acting-run.json
          sts2-ai export-training \
            results/shadow/low.sqlite results/shadow/low-roots.jsonl
          sts2-ai export-training \
            results/shadow/high.sqlite results/shadow/high-roots.jsonl
      - name: Compare exactly matched roots and curate without label sharpening
        run: |
          sts2-ai compare-teachers \
            results/shadow/low-roots.jsonl results/shadow/high-roots.jsonl \
            --json-output results/shadow/matched-comparison.json
          sts2-ai diagnose-training results/shadow/low-roots.jsonl \
            --json-output results/shadow/low-audit.json
          sts2-ai diagnose-training results/shadow/high-roots.jsonl \
            --json-output results/shadow/high-audit.json
          sts2-ai curate-teacher results/shadow/high-roots.jsonl \
            --min-budget 64 --min-visits-per-semantic-action 2 \
            --min-semantic-top-margin 0.08 --min-semantic-value-gap 0.01 \
            --output results/shadow/curated-roots.jsonl \
            --json-output results/shadow/curation.json
      - name: Distill directional Q-value policy labels with two evidence thresholds
        run: |
          sts2-ai distill-q-teacher \
            results/shadow/high-roots.jsonl results/shadow/q-conservative.jsonl \
            --json-output results/shadow/q-conservative-audit.json
          sts2-ai distill-q-teacher \
            results/shadow/high-roots.jsonl results/shadow/q-exploratory.jsonl \
            --min-value-gap 0.02 --uncertainty-scale 0.0 \
            --json-output results/shadow/q-exploratory-audit.json
          if test "$(wc -l < results/shadow/q-conservative.jsonl)" -ge 16; then
            cp results/shadow/q-conservative.jsonl results/shadow/chosen-q-roots.jsonl
            echo conservative > results/shadow/q-evidence-level.txt
          elif test "$(wc -l < results/shadow/q-exploratory.jsonl)" -ge 16; then
            cp results/shadow/q-exploratory.jsonl results/shadow/chosen-q-roots.jsonl
            echo exploratory > results/shadow/q-evidence-level.txt
          else
            echo insufficient > results/shadow/q-evidence-level.txt
            echo "Too little directional Q evidence to justify neural training"
          fi
      - name: Train policy-only neural model if Q evidence is sufficient
        run: |
          if test -f results/shadow/chosen-q-roots.jsonl; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
            sts2-ai train-neural \
              results/shadow/chosen-q-roots.jsonl \
              results/shadow/q-neural.json \
              --epochs 12 --dimension 256 --hidden 32 \
              --root-value-weight 0 \
              --json-output results/shadow/q-neural-validation.json
          fi
      - name: Compare Q-distilled rollout policy on six independent seed runs
        run: |
          if test -f results/shadow/q-neural.json; then
            sts2-ai evaluate --agent mcts --budget 16 --rollout-depth 24 \
              --rollout-batch-size 8 --seeds 6 --max-decisions 64 \
              --seed-prefix qteacher-heldout --no-build \
              --strategy-db results/shadow/heldout-baseline.sqlite \
              --json-output results/shadow/heldout-baseline.json
            sts2-ai evaluate --agent mcts --budget 16 --rollout-depth 24 \
              --rollout-batch-size 8 --seeds 6 --max-decisions 64 \
              --seed-prefix qteacher-heldout --no-build \
              --neural-rollout-model results/shadow/q-neural.json \
              --strategy-db results/shadow/heldout-q-neural.sqlite \
              --json-output results/shadow/heldout-q-neural.json
            sts2-ai compare-evaluations \
              results/shadow/heldout-baseline.json \
              results/shadow/heldout-q-neural.json \
              --json-output results/shadow/heldout-q-comparison.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matched-root-q-policy-six-seed-evidence
          path: results/shadow/
          if-no-files-found: warn
          retention-days: 14
